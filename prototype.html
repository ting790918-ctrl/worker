<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>房東智慧收租 App｜原型</title>
<style>
:root{
  --bg:#F4F5F7; --card:#FFF; --ink:#111827; --ink2:#4B5563; --ink3:#9CA3AF;
  --line:#E5E7EB; --brand:#0F766E; --soft:#E6F2F0;
  --red:#DC2626; --reds:#FEE9E9; --amber:#B45309; --ambers:#FEF3C7;
  --green:#047857; --greens:#DCFCE7; --blue:#1D4ED8; --blues:#DBEAFE;
  --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:#E7E9ED;color:var(--ink);font-size:15px;line-height:1.5;display:flex;justify-content:center;min-height:100vh}
#phone{width:100%;max-width:430px;background:var(--bg);min-height:100vh;position:relative;display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.12)}
.hdr{background:var(--brand);color:#fff;padding:14px 18px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30}
.hdr h1{font-size:17px;margin:0;font-weight:600}
.hdr .sub{font-size:12px;opacity:.82;margin-top:2px}
.back{background:rgba(255,255,255,.16);border:0;color:#fff;width:30px;height:30px;border-radius:9px;font-size:16px;cursor:pointer;flex:none}
main{flex:1;overflow-y:auto;padding:14px 14px 96px}
.screen{display:none;animation:fade .18s ease}.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.sec{font-size:13px;font-weight:700;color:var(--ink2);margin:20px 4px 9px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sec:first-child{margin-top:4px}
.sec small{font-weight:400;color:var(--ink3);font-size:11.5px}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh);overflow:hidden}
.pad{padding:16px}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.mid{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.k{font-size:12.5px;color:var(--ink2)}
.row3{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--ink2)}
.row3 b{color:var(--ink);font-variant-numeric:tabular-nums}
.item{padding:14px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer}
.item:last-child{border-bottom:0}
.item .l{min-width:0;flex:1}.item .t{font-size:14.5px;font-weight:600}
.item .s{font-size:12.5px;color:var(--ink3);margin-top:2px}
.item .r{text-align:right;flex:none;font-variant-numeric:tabular-nums}
.item.flat{cursor:default}
.item.new{background:#F0FBF9;border-left:3px solid var(--brand)}
.item.sum{background:#FAFAFA}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;display:inline-block;white-space:nowrap}
.t-red{background:var(--reds);color:var(--red)}.t-amb{background:var(--ambers);color:var(--amber)}
.t-grn{background:var(--greens);color:var(--green)}.t-blu{background:var(--blues);color:var(--blue)}
.t-gry{background:#F3F4F6;color:#6B7280}.t-new{background:var(--brand);color:#fff}
.btn{border:0;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;width:100%;font-family:inherit}
.b1{background:var(--brand);color:#fff}.b2{background:#F3F4F6;color:var(--ink2)}.b3{background:var(--reds);color:var(--red)}
.btns{display:flex;gap:9px;padding:13px 15px}
.note{background:var(--soft);border-radius:12px;padding:11px 13px;font-size:12.5px;color:#115E59;line-height:1.55}
.hint{font-size:11.5px;color:var(--ink3);padding:9px 6px 0;line-height:1.6}
.mute{color:var(--ink3)}
.empty{padding:34px 22px;text-align:center;color:var(--ink3);font-size:14px}
.empty .e1{font-size:36px;margin-bottom:10px}
.empty .e2{color:var(--ink);font-size:16px;font-weight:700;margin-bottom:5px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
nav button{background:0;border:0;padding:9px 0 10px;font-size:10.5px;color:var(--ink3);cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .ni{font-size:19px;line-height:1}
nav button.on{color:var(--brand);font-weight:700}
.mask{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:50;display:none;max-width:430px;margin:0 auto}.mask.on{display:block}
.sheet{position:fixed;bottom:0;left:0;right:0;max-width:430px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;z-index:60;transform:translateY(101%);transition:transform .26s cubic-bezier(.32,.72,0,1);max-height:88vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
.sheet.on{transform:none}
.sheet .bar{width:38px;height:4px;background:#D1D5DB;border-radius:3px;margin:9px auto 4px}
.sh{padding:8px 18px 12px;border-bottom:1px solid var(--line)}
.sh h2{margin:0;font-size:17px}.sh p{margin:3px 0 0;font-size:12.5px;color:var(--ink3)}
.sb{padding:15px 18px}
.kv{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;border-bottom:1px dashed var(--line);gap:12px}
.kv:last-child{border-bottom:0}.kv span{color:var(--ink2);flex:none}.kv b{font-variant-numeric:tabular-nums;text-align:right}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 4px;border-top:2px solid var(--ink);margin-top:8px}
.tot b{font-size:22px;font-variant-numeric:tabular-nums}
.todo{padding:14px 15px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo .top{display:flex;gap:11px;align-items:flex-start;cursor:pointer}
.todo .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex:none}
.todo .tx{flex:1;min-width:0}
.todo .tt{font-size:14.5px;font-weight:600}
.todo .ts{font-size:12.5px;color:var(--ink3);margin-top:2px}
.todo .amt{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.todo .act{display:flex;gap:8px;margin-top:11px}
.todo .act button{flex:1;border:0;border-radius:10px;padding:10px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
.seg{display:flex;background:#EDEFF2;border-radius:12px;padding:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:0;padding:9px 0;border-radius:9px;font-size:13.5px;font-weight:600;color:var(--ink2);cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;color:var(--brand);font-weight:700;box-shadow:var(--sh)}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--brand)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt{background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:13px 11px;font-size:13.5px;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink)}
.opt.on{border-color:var(--brand);background:var(--soft);font-weight:700;color:#115E59}
.opt small{display:block;color:var(--ink3);font-size:11px;font-weight:400;margin-top:2px}
input.f,textarea.f{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:13px;font-size:18px;font-family:inherit;font-variant-numeric:tabular-nums;background:#fff}
input.f:focus,textarea.f:focus{outline:0;border-color:var(--brand)}
input.sm{padding:10px 11px;font-size:15px;border-radius:10px}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
.lbl{font-size:12.5px;color:var(--ink2);margin-bottom:6px}
.rr{display:grid;grid-template-columns:1fr 1.2fr auto;gap:7px;align-items:center;margin-bottom:8px}
.rr button{background:var(--reds);color:var(--red);border:0;width:34px;height:38px;border-radius:10px;font-size:16px;cursor:pointer}
.auto{display:flex;align-items:center;gap:9px;padding:11px 13px;background:var(--greens);border-radius:12px;font-size:12.5px;color:#065F46;margin-top:10px}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(14px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:24px;font-size:13.5px;font-weight:600;z-index:80;opacity:0;transition:.24s;pointer-events:none;max-width:90%;display:flex;align-items:center;gap:12px}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast button{background:rgba(255,255,255,.2);border:0;color:#fff;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:16px;cursor:pointer;font-family:inherit;flex:none}
.lbar{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:7px;max-width:200px}
.lbar i{display:block;height:100%;background:var(--brand);border-radius:3px}
.demo{margin-top:26px;text-align:center}
.demo button{background:none;border:1px dashed var(--line);color:var(--ink3);font-size:12px;padding:9px 15px;border-radius:20px;cursor:pointer;font-family:inherit}
.hpick{display:flex;align-items:center;gap:12px;padding:15px;background:#fff;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;width:100%;font-family:inherit;text-align:left;margin-bottom:9px}
.hpick.on{border-color:var(--brand);background:var(--soft)}
.hpick .hi{font-size:24px;flex:none}
.hpick .hn{flex:1;min-width:0}.hpick .hn b{display:block;font-size:15.5px}.hpick .hn small{color:var(--ink3);font-size:12px}
.hpick .ar{color:var(--ink3);font-size:19px;flex:none}
.rooms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:-2px 0 12px;padding:12px;background:#F8FAFA;border-radius:12px;border:1px solid var(--soft)}
.rooms button{padding:12px 6px;border:1.5px solid var(--line);background:#fff;border-radius:11px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink)}
.rooms button.wide{grid-column:1/-1;font-weight:700;color:var(--brand);border-color:var(--soft);background:var(--soft)}
.recent{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px}
.recent button{flex:none;background:#fff;border:1.5px solid var(--soft);color:#115E59;border-radius:20px;padding:9px 14px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.crumb{display:flex;align-items:center;gap:7px;background:var(--soft);color:#115E59;border-radius:11px;padding:10px 13px;font-size:13px;font-weight:600;margin-bottom:12px}
.crumb button{margin-left:auto;background:none;border:0;color:#115E59;font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit}
/* 合約 */
.ct{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;cursor:pointer}
.ct:last-child{border-bottom:0}
.ct .cl{font-size:12.5px;color:var(--ink3);flex:none;width:88px;padding-top:2px}
.ct .cv{flex:1;font-size:14.5px;font-weight:600;text-align:right}
.ct .ce{color:var(--brand);font-size:12px;flex:none;text-decoration:underline;padding-top:3px}
</style>
</head>
<body>
<div id="phone">
  <div class="hdr">
    <button class="back" id="back" style="display:none" onclick="goBack()">‹</button>
    <div style="flex:1"><h1 id="ttl">我的房產</h1><div class="sub" id="sub">2026 年 8 月 19 日</div></div>
  </div>
  <main>
    <section class="screen on" id="s-home"><div id="homeBody"></div></section>
    <section class="screen" id="s-houses">
      <button class="btn b1" style="margin-bottom:9px" onclick="tab('new')">＋ 新增房子</button>
      <div class="card" style="margin-bottom:6px">
        <div class="item" onclick="openAcct()"><div class="l"><div class="t">💳 我的收款帳戶</div>
          <div class="s">房客要匯到哪個戶頭 · 依戶頭對帳</div></div><div class="r mute" style="font-size:20px">›</div></div>
        <div class="item" onclick="openMeter()"><div class="l"><div class="t">⚡ 抄電表</div>
          <div class="s">只要打本期度數，金額與帳單自動</div></div><div class="r mute" style="font-size:20px">›</div></div>
        <div class="item" onclick="openTenant()"><div class="l"><div class="t">👤 看看房客看到什麼</div>
          <div class="s">預覽房客手機上的畫面</div></div><div class="r mute" style="font-size:20px">›</div></div>
      </div>
      <div id="houseList"></div></section>
    <section class="screen" id="s-new"><div class="steps"><i id="ns1"></i><i id="ns2"></i><i id="ns3"></i><i id="ns4"></i></div><div id="newStep"></div></section>
    <section class="screen" id="s-pl"><div id="plBody"></div></section>
    <section class="screen" id="s-plh"><div id="plhBody"></div></section>
    <section class="screen" id="s-add"><div class="steps"><i id="st1"></i><i id="st2"></i><i id="st3"></i></div><div id="addStep"></div></section>
    <section class="screen" id="s-ct"><div id="ctBody"></div></section>
    <section class="screen" id="s-edit"><div id="editBody"></div></section>
    <section class="screen" id="s-trade"><div id="tradeBody"></div></section>
    <section class="screen" id="s-acct"><div id="acctBody"></div></section>
    <section class="screen" id="s-meter"><div id="meterBody"></div></section>
    <section class="screen" id="s-tenant"><div id="tenantBody"></div></section>
  </main>
  <nav>
    <button class="on" data-t="home" onclick="tab('home')"><span class="ni">🏠</span>首頁</button>
    <button data-t="houses" onclick="tab('houses')"><span class="ni">🏢</span>房子</button>
    <button data-t="add" onclick="tab('add')"><span class="ni">➕</span>記一筆</button>
    <button data-t="pl" onclick="tab('pl')"><span class="ni">📊</span>損益</button>
  </nav>
  <div class="mask" id="mask" onclick="closeSheet()"></div>
  <div class="sheet" id="sheet"><div class="bar"></div><div id="sheetC"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ============ 資料：全新帳號＝空的 ============ */
let B=[], S={todos:[],expenses:[],recent:[]};
let lastAdded=null, plHid=null, prev='pl', period='month', undoStack=null;

const money=n=>'$'+Math.abs(n||0).toLocaleString('en-US');
const signed=n=>(n<0?'−':'+')+money(n);
const rooms=()=>B.reduce((s,b)=>s+b.rooms.length,0);
const rented=()=>B.reduce((s,b)=>s+b.rooms.filter(r=>r.tenant).length,0);
const byId=id=>B.find(b=>b.id===id);
const monthIn=()=>B.reduce((s,b)=>s+(b.income||0),0);
const monthUnpaid=()=>B.reduce((s,b)=>s+(b.unpaid||0),0);
const monthEx=()=>S.expenses.reduce((s,e)=>s+e.a,0);

/* 某房子本月支出＝直接＋分攤 */
function hEx(b){
  const d=S.expenses.filter(e=>e.hid===b.id).reduce((s,e)=>s+e.a,0);
  const sh=S.expenses.filter(e=>e.hid==='ALL').reduce((s,e)=>s+e.a,0);
  const al=rooms()?Math.round(sh*b.rooms.length/rooms()):0;
  return {direct:d, alloc:al, total:d+al};
}
/* 依期間取某房子的收支 */
function hFig(b){
  const m={in:b.income||0, ex:hEx(b).total};
  if(period==='month') return m;
  const base=period==='year'?(b.ytd||{in:0,ex:0}):(b.cum||{in:0,ex:0});
  return {in:base.in+m.in, ex:base.ex+m.ex};
}
const hNet=b=>{const f=hFig(b);return f.in-f.ex;};
const allFig=()=>B.reduce((a,b)=>{const f=hFig(b);return{in:a.in+f.in,ex:a.ex+f.ex};},{in:0,ex:0});
/* 買賣 */
const BUYF=[['buy','成交價'],['agent','仲介費'],['scriv','代書費'],['deedTax','契稅'],['stamp','印花稅'],['landFee','地政規費'],['deco','裝潢／整修'],['bother','其他取得費用']];
const SELLF=[['sell','賣出成交價'],['sAgent','仲介服務費'],['sScriv','代書費'],['landVAT','土地增值稅'],['incTax','房地合一稅'],['sother','其他賣出費用']];
function trade(b){
  const t=b.trade; if(!t) return null;
  const cost=BUYF.reduce((a,f)=>a+(t[f[0]]||0),0);
  if(!t.sold) return {sold:false, cost, t};
  const sellCost=SELLF.slice(1).reduce((a,f)=>a+(t[f[0]]||0),0);
  return {sold:true, cost, sellCost, gain:(t.sell||0)-cost-sellCost, t};
}

/* ============ 首頁：三張卡 ============ */
function renderHome(){
  if(!B.length){
    homeBody.innerHTML=`
      <div class="card empty" style="padding:40px 24px"><div class="e1">🏠</div>
        <div class="e2">先新增你的第一間房子</div>建立之後，系統就會開始<br>自動產生租金、提醒繳款、算損益</div>
      <button class="btn b1" style="margin-top:14px" onclick="tab('new')">＋ 新增房子</button>
      <div class="card pad" style="margin-top:16px">
        <div style="font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:10px">建立後這些系統自己做，不會來吵你</div>
        <div style="font-size:13px;color:var(--ink2);line-height:2">
          🤖 每月自動開租金帳單<br>🤖 到期前提醒房客、逾期自動催繳<br>🤖 房貸、稅、保險到期自動記帳<br>
          🤖 水電費自動算、自動開單<br>🤖 隨時算出每間房實際賺多少</div></div>
      <div class="demo"><button onclick="loadDemo()">🔍 我想先看有資料時長什麼樣</button></div>`;
    return;
  }
  const net=monthIn()-monthEx();
  const pays=S.todos.filter(t=>t.k==='pay');
  homeBody.innerHTML=`
    <div class="sec">🔔 我的待辦 <small>其他系統自己處理</small></div>
    ${pays.length>1?`<button class="btn b1" style="margin-bottom:9px" onclick="confirmAll()">全部確認收到（${pays.length} 筆 ${money(pays.reduce((s,t)=>s+t.amt,0))}）</button>`:''}
    <div id="todoList"></div>

    <div class="sec">📅 這個月</div>
    <div class="card pad" onclick="tab('pl')" style="cursor:pointer">
      <div class="k">這個月淨賺</div>
      <div class="big" style="color:${net<0?'var(--red)':'var(--ink)'}">${net<0?'−':''}${money(net)}</div>
      <div class="row3">
        <span>收到 <b>${money(monthIn())}</b></span>
        <span>還沒收 <b style="color:var(--red)">${money(monthUnpaid())}</b></span>
        <span>花費 <b>${money(monthEx())}</b></span></div>
    </div>
    ${(!monthIn()&&monthEx())?`<div class="hint">💡 目前是負的很正常 — 還沒收到租金，但房貸這些已經在跑。租出去就會轉正。</div>`:''}

    <div class="sec">🏠 我的房子</div>
    <div class="card pad" onclick="tab('houses')" style="cursor:pointer">
      <div class="row3" style="margin-top:0;font-size:14px">
        <span>出租中 <b>${rented()}</b></span>
        <span>空房 <b>${rooms()-rented()}</b></span>
        <span>物件 <b>${B.length}</b></span>
        <span>總房間 <b>${rooms()}</b></span></div>
    </div>
    <div class="demo"><button onclick="resetAll()">↺ 清空，回到全新帳號</button></div>`;
  renderTodos();
}

/* ============ 待辦（首頁可一鍵完成） ============ */
function renderTodos(){
  const el=document.getElementById('todoList'); if(!el) return;
  if(!S.todos.length){ el.innerHTML=`<div class="card empty"><div class="e1">✅</div><div class="e2">目前沒有待辦</div>其他交給系統處理</div>`; return; }
  el.innerHTML=`<div class="card">`+S.todos.map(t=>{
    let acts='';
    if(t.k==='pay') acts=`<button style="background:var(--brand);color:#fff" onclick="event.stopPropagation();done('${t.id}',true)">確認收到</button>`;
    if(t.k==='fix') acts=`<button style="background:var(--reds);color:var(--red)" onclick="event.stopPropagation();done('${t.id}',false)">不同意</button>
                          <button style="background:var(--brand);color:#fff" onclick="event.stopPropagation();done('${t.id}',true)">同意維修</button>`;
    if(t.k==='renew') acts=`<button style="background:var(--reds);color:var(--red)" onclick="event.stopPropagation();done('${t.id}',false)">不續約</button>
                            <button style="background:var(--brand);color:#fff" onclick="event.stopPropagation();done('${t.id}',true)">續約</button>`;
    if(t.k==='sign') acts=`<button style="background:var(--brand);color:#fff" onclick="event.stopPropagation();done('${t.id}',true)">簽名並送出</button>`;
    return `<div class="todo"><div class="top" onclick="openTodo('${t.id}')">
        <div class="ic" style="background:${t.bg}">${t.ic}</div>
        <div class="tx"><div class="tt">${t.t}</div><div class="ts">${t.s}</div></div>
        ${t.amt?`<div class="amt">${money(t.amt)}</div>`:'<div class="amt mute" style="font-size:19px">›</div>'}
      </div><div class="act">${acts}</div></div>`;}).join('')+`</div>
    <div class="hint">💡 直接按就完成，不用點進去。想看明細再點文字。</div>`;
}
function openTodo(id){
  const t=S.todos.find(x=>x.id===id); if(!t) return; const d=t.detail;
  sheetC.innerHTML=`<div class="sh"><h2>${d.title}</h2><p>${d.who}</p></div><div class="sb">
    ${d.rows.map(r=>`<div class="kv"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}
    ${d.total?`<div class="tot"><span>合計</span><b>${money(d.total)}</b></div>`:''}
    <div class="note" style="margin-top:14px">${d.way}</div></div>
    <div class="btns"><button class="btn b2" onclick="closeSheet()">關閉</button></div>`;
  mask.classList.add('on'); sheet.classList.add('on');
}
function done(id,agree){
  const i=S.todos.findIndex(x=>x.id===id); if(i<0) return;
  const t=S.todos[i], b=t.hid?byId(t.hid):null;
  undoStack={t, i, snapshot:{income:b?b.income:0, unpaid:b?b.unpaid:0, exLen:S.expenses.length, room:null}};
  if(b && t.ref){ undoStack.snapshot.room={...b.rooms[t.ref]}; }
  if(t.k==='pay'&&b){ b.income+=t.amt; b.unpaid-=t.amt; }
  if(t.k==='fix'&&agree&&b) S.expenses.push({n:'水管維修',a:t.amt,auto:1,hid:b.id,room:t.room||'',cat:'修繕維護'});
  if(b&&t.ref!=null&&t.after&&agree!==false) Object.assign(b.rooms[t.ref], t.after);
  S.todos.splice(i,1);
  closeSheet(); renderAll();
  const msg={pay:'已收到，記錄完成',fix:agree?'已通知廠商，完工自動記帳':'已回覆不同意',
             renew:agree?'已詢問房客續約意願':'已啟動退租流程',sign:'已簽署，系統開始自動收租'}[t.k];
  toastMsg(msg, true);
}
function confirmAll(){
  const pays=S.todos.filter(t=>t.k==='pay'); if(!pays.length) return;
  const snap={todos:JSON.parse(JSON.stringify(S.todos)), inc:B.map(b=>({id:b.id,income:b.income,unpaid:b.unpaid,rooms:JSON.parse(JSON.stringify(b.rooms))}))};
  let sum=0;
  pays.forEach(t=>{ const b=byId(t.hid); if(b){b.income+=t.amt;b.unpaid-=t.amt; if(t.ref!=null&&t.after)Object.assign(b.rooms[t.ref],t.after);} sum+=t.amt; });
  S.todos=S.todos.filter(t=>t.k!=='pay');
  undoStack={bulk:snap};
  renderAll(); toastMsg(`${pays.length} 筆共 ${money(sum)} 已收到`, true);
}
function undo(){
  if(!undoStack) return;
  if(undoStack.bulk){
    S.todos=undoStack.bulk.todos;
    undoStack.bulk.inc.forEach(x=>{const b=byId(x.id); if(b){b.income=x.income;b.unpaid=x.unpaid;b.rooms=x.rooms;}});
  } else {
    const {t,i,snapshot}=undoStack, b=t.hid?byId(t.hid):null;
    if(b){ b.income=snapshot.income; b.unpaid=snapshot.unpaid; if(snapshot.room&&t.ref!=null) b.rooms[t.ref]=snapshot.room; }
    S.expenses.length=snapshot.exLen;
    S.todos.splice(i,0,t);
  }
  undoStack=null; renderAll(); toastMsg('已復原');
}
function closeSheet(){ mask.classList.remove('on'); sheet.classList.remove('on'); }
function toastMsg(m,canUndo){
  toast.innerHTML=`<span>${m}</span>`+(canUndo?`<button onclick="undo()">復原</button>`:'');
  toast.classList.add('on'); clearTimeout(toast._t);
  toast._t=setTimeout(()=>{toast.classList.remove('on'); undoStack=null;}, canUndo?5000:2400);
}

/* ============ 損益 ============ */
const NOW='2026-08';
const ymN=y=>{const[a,b]=y.split('-').map(Number);return a*12+(b-1);};
const ymS=n=>Math.floor(n/12)+'/'+String(n%12+1).padStart(2,'0');
function loanInfo(l){ const paid=Math.min(l.total,Math.max(0,ymN(NOW)-ymN(l.start)+1));
  return {paid,rem:Math.max(0,l.total-paid),total:l.total,end:ymS(ymN(l.start)+l.total-1)}; }
const termT=n=>{const y=Math.floor(n/12),m=n%12;return (y?y+' 年':'')+(m?(y?' ':'')+m+' 個月':(y?'':'0 個月'));};
function exRow(e){
  let sub=e.auto?'系統自動記的，你沒動手':'你自己記的', bar='';
  if(e.loan){const L=loanInfo(e.loan);

const A={step:1,hid:null,room:'',cat:null,note:'',openHid:null};
const CATS=[['🔧','修繕維護'],['🏦','房貸'],['📋','稅費'],['🛡️','保險'],['🏢','管理費'],['🧹','清潔'],['🪑','家具家電'],['📦','其他']];
function resetA(){Object.assign(A,{step:1,hid:null,room:'',cat:null,note:'',openHid:null});}
function quickAdd(hid){ resetA(); A.hid=hid; A.step=2; renderAdd(); show('add'); }
function pickB(hid){ const b=byId(hid);
  if(b&&b.rooms.length>1){ A.openHid=(A.openHid===hid?null:hid); renderAdd(); return; }
  A.hid=hid; A.room=''; A.step=2; renderAdd(); }
function pickR(hid,no){ A.hid=hid; A.room=no; A.step=2; renderAdd(); }
function pickAll(){ A.hid='ALL'; A.room=''; A.step=2; renderAdd(); }
function whereT(){ if(A.hid==='ALL') return '全部房子分攤';
  const b=byId(A.hid); if(!b) return '';
  return b.name+(A.room?' · '+A.room:(b.rooms.length>1?' · 整棟分攤':'')); }
function useRecent(i){ const r=S.recent[i]; A.hid=r.hid; A.room=r.room; A.cat=r.cat; A.note=r.note||''; A.step=3; renderAdd(); }
function catsSorted(){ const c=S.catUse||{}; return [...CATS].sort((a,b)=>(c[b[1]]||0)-(c[a[1]]||0)); }
function renderAdd(){
  st1.className=A.step>=1?'on':'';st2.className=A.step>=2?'on':'';st3.className=A.step>=3?'on':'';
  if(!B.length){ addStep.innerHTML=`<div class="card empty"><div class="e1">➕</div><div class="e2">先新增一間房子</div>才知道這筆錢要算在哪</div>

          ${b.rooms.map(r=>`<button onclick="pickR('${b.id}','${r.no}')">${r.no}</button>`).join('')}</div>`:''}`).join('')}
      ${B.length>1?`<button class="hpick" onclick="pickAll()"><span class="hi">🏘️</span>
        <span class="hn"><b>全部房子分攤</b><small>按房間數自動分到每一間</small></span><span class="ar">›</span></button>`:''}`;
  } else if(A.step===2){
    addStep.innerHTML=`<div class="crumb">📍 ${whereT()} <button onclick="A.step=1;renderAdd()">改</button></div>

      <div class="opts">${catsSorted().map(c=>`<button class="opt ${A.cat===c[1]?'on':''}" onclick="A.cat='${c[1]}';A.step=3;renderAdd()">${c[0]} ${c[1]}</button>`).join('')}</div>`;
  } else if(A.step===3){
    const isOther = A.cat==='其他';

        ${past.length?`<div class="recent">${past.map((n,i)=>`<button onclick="useOther(${i})">${n}</button>`).join('')}</div>`:''}
        <input class="f" style="font-size:17px" id="note" placeholder="自己打，例：消防安檢、代辦費" value="${A.note||''}">
        <div class="sec">④ 多少錢？</div>`
      :`<div class="sec">③ 多少錢？</div>`}
      <input class="f" id="amt" type="number" inputmode="numeric" placeholder="0">
      <div class="auto">📷 可以先拍收據，金額之後再補</div>
      <button class="btn b1" style="margin-top:16px" onclick="saveExp()">完成</button>`;
    setTimeout(()=>document.getElementById(isOther&&!A.note?'note':'amt')?.focus(),60);

    const b=A.hid==='ALL'?null:byId(A.hid);
    addStep.innerHTML=`<div class="card empty"><div class="e1">✅</div><div class="e2">記好了</div>${b?b.name:'全部房子'}的損益已更新</div>

        <div style="font-weight:700;margin-bottom:4px">這筆每個月都有嗎？</div>
        <div class="k">設定一次，以後系統每月自動記，你不用再進來</div>
        <div style="display:flex;gap:9px;margin-top:12px">
          <button class="btn b2" onclick="finishAdd(0)">不用，這是一次性的</button>
          <button class="btn b1" onclick="finishAdd(1)">是，每月自動記</button></div></div>`;
  } else {

      <div style="display:flex;gap:9px;margin-top:14px">

        ${b?`<button class="btn b1" onclick="openPL('${b.id}','add')">看這間的損益</button>`:''}</div>`;
  }
}
function useOther(i){ A.note=(S.otherNames||[])[i]; renderAdd(); }
function saveExp(){
  const nEl=document.getElementById('note');
  if(nEl){ A.note=nEl.value.trim(); if(!A.note){ toastMsg('請先寫這筆是什麼'); nEl.focus(); return; } }
  const v=Math.abs(parseInt(document.getElementById('amt').value||0,10));
  if(!v){ toastMsg('請輸入金額'); return; }
  const b=A.hid==='ALL'?null:byId(A.hid);
  const name=A.cat==='其他'?A.note:A.cat;
  S.expenses.push({n:name,a:v,auto:0,hid:A.hid,room:A.room,cat:A.cat});
  S.catUse=S.catUse||{}; S.catUse[A.cat]=(S.catUse[A.cat]||0)+1;
  if(A.cat==='其他'){ S.otherNames=[A.note,...(S.otherNames||[]).filter(x=>x!==A.note)].slice(0,6); }
  const label=(b?(A.room||b.name):'全部房子')+' · '+name;
  S.recent=[{hid:A.hid,room:A.room,cat:A.cat,note:A.note,label},...S.recent.filter(r=>r.label!==label)].slice(0,4);
  A.step=4; renderAll(); renderAdd();
}
function finishAdd(rep){
  if(rep){ const e=S.expenses[S.expenses.length-1]; e.auto=1; e.n=e.n+'（每月）'; renderAll(); }
  A.step=5; renderAdd(); toastMsg(rep?'以後每月自動記，不用再進來':'已記錄');
}

const N={step:1,type:null,addr:'',name:'',rooms:[],pay:'',years:'',sy:'',sm:''};
const TYPES=[['🏢','分租套房／雅房','一層多間，各自合約與電表'],['🏠','整層／整戶','一個地址一份合約'],
             ['🏬','店面／辦公／庫房','商用租賃'],['🅿️','車位／倉庫','單純收租']];
function resetN(){Object.assign(N,{step:1,type:null,addr:'',name:'',rooms:[],pay:'',years:'',sy:'',sm:''});}
/* 從地址自動生成名稱 */
function autoName(addr){
  if(!addr) return '';
  let s=addr.replace(/^.*?(縣|市)/,'').replace(/^.*?(區|鄉|鎮|市)/,'');
  const road=s.match(/^(.{2,6}?(?:路|街|大道))/); const seg=s.match(/([一二三四五六七八九十]段)/);
  const fl=addr.match(/(\d+)\s*樓/)||addr.match(/(\d+)F/i);
  let n=(road?road[1]:s.slice(0,6));
  if(seg) n+=seg[1];
  if(fl) n+=' '+fl[1]+'F';
  return n.trim();
}
function renderNew(){
  [1,2,3,4].forEach(i=>document.getElementById('ns'+i).className=N.step>=i?'on':'');
  const split=N.type===TYPES[0][1];
  if(N.step===1){
    newStep.innerHTML=`<div class="sec">① 這是什麼型態的房子？</div><div style="display:grid;gap:9px">
      ${TYPES.map(t=>`<button class="opt ${N.type===t[1]?'on':''}" style="font-size:15px" onclick="pickType('${t[1]}')">${t[0]} ${t[1]}<small>${t[2]}</small></button>`).join('')}</div>`;
  } else if(N.step===2){
    newStep.innerHTML=`<div class="sec">② 地址<small> · ${N.type}</small></div>
      <div class="card pad">
        <div class="lbl">地址 <b style="color:var(--red)">*</b></div>
        <input class="f" style="font-size:16px" id="ad" placeholder="例：台北市大安區復興南路一段100號2樓" value="${N.addr}" oninput="liveName(this.value)">
        <div class="lbl" style="margin-top:14px">名稱 <span class="mute">（系統自動幫你取，不喜歡可以改）</span></div>
        <input class="f" style="font-size:16px" id="nm" value="${N.name}">
      </div>
      <button class="btn b1" style="margin-top:14px" onclick="nextBasic()">下一步</button>

function renderMeter(){
  const list=meterRooms();
  if(!list.length){ meterBody.innerHTML=`<div class="card empty"><div class="e1">⚡</div><div class="e2">目前沒有要抄的表</div>合約選「分表計算」並填了抄表日的房間，到日子會出現在這裡</div>`; return; }
  let total=0;
  const rows=list.map((x,i)=>{
    const cur=MT[i], used=(cur!=null&&cur!=='')?Math.max(0,cur-x.r.meter.last):null;
    const amt=used!=null?used*x.r.meter.price:null; if(amt) total+=amt;
    return `<div class="card" style="margin-bottom:10px"><div class="pad" style="padding:14px 15px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><div style="font-weight:700">${x.b.name} ${x.r.no}</div>
          <div class="s mute" style="font-size:12.5px">${x.r.tenant} · 上期 ${x.r.meter.last} 度 · ${money(x.r.meter.price)}／度</div></div>
        <div style="width:110px"><input class="f sm" style="text-align:right" type="number" inputmode="numeric"
          placeholder="本期度數" value="${cur==null?'':cur}" oninput="MT[${i}]=this.value;renderMeter()"></div></div>
      ${used!=null?`<div class="auto" style="margin-top:10px">用了 <b>${used}</b> 度 × ${money(x.r.meter.price)} ＝ <b>${money(amt)}</b>，系統會自動開單給 ${x.r.tenant}</div>`:''}
    </div></div>`;}).join('');
  meterBody.innerHTML=`<div class="note">系統已經幫你帶好上期度數與單價。<b>你只要打本期度數</b>，金額、帳單、通知房客全部自動。</div>
    <div style="margin-top:12px">${rows}</div>
    ${total?`<div class="card" style="border:2px solid var(--brand)"><div class="pad">
      <div class="k">這次總共要跟房客收</div><div class="big">${money(total)}</div></div></div>`:''}
    <button class="btn b1" style="margin-top:14px" onclick="sendMeter()">開帳單給房客</button>
    <div class="hint">💡 抄表日到了系統會提醒你一次，抄完就沒事了。</div>`;
  const f=Object.keys(MT).length; if(f===0) setTimeout(()=>meterBody.querySelector('input')?.focus(),60);
}
function sendMeter(){
  const list=meterRooms(); let n=0,total=0;
  list.forEach((x,i)=>{ const cur=MT[i]; if(cur==null||cur==='') return;
    const used=Math.max(0,cur-x.r.meter.last), amt=used*x.r.meter.price;
    x.r.meter.last=parseInt(cur,10); x.b.unpaid+=amt; total+=amt; n++; });
  if(!n){ toastMsg('至少要填一個度數'); return; }
  MT={}; renderAll(); show('houses'); toastMsg(`${n} 間的電費 ${money(total)} 已開單並通知房客`);
}

  const total=items.reduce((s,x)=>s+x[1],0);
  tenantBody.innerHTML=`

    <div class="card pad" style="margin-top:12px;text-align:center">

    </div>
    <div class="card" style="margin-top:12px">
      ${items.map(x=>`<div class="item flat"><div class="l"><div class="t">${x[0]}</div></div><div class="r"><b>${money(x[1])}</b></div></div>`).join('')}
      <div class="item sum flat"><div class="l"><div class="t">合計</div></div><div class="r"><b>${money(total)}</b></div></div></div>

    <div class="sec">💳 匯款資訊</div>
    <div class="card"><div class="pad" style="padding:14px 15px">
      <div class="kv"><span>銀行</span><b>${acc.bank}</b></div>
      <div class="kv"><span>戶名</span><b>${acc.name}</b></div>
      <div class="kv"><span>帳號</span><b style="font-size:16px">${acc.no}</b></div>
      <button class="btn b2" style="margin-top:12px" onclick="toastMsg('已複製帳號 ${acc.no}')">複製帳號</button>
    </div></div>

    ${TN.paid?`<div class="card empty" style="margin-top:14px;padding:26px"><div class="e1">🟡</div>
        <div class="e2">已回報付款</div>房東確認收到後就會變成已繳清</div>`
      :`<button class="btn b1" style="margin-top:14px" onclick="TN.paid=true;renderTenant();toastMsg('已通知房東查收')">我已付款</button>`}
    <button class="btn b2" style="margin-top:10px" onclick="toastMsg('拍照＋說明，送出後房東會收到（下一版）')">🔧 我要報修</button>
    <div class="hint">💡 房客只有三種狀態：🔴 待繳、🟡 已付款待確認、🟢 已繳清。沒有別的東西讓他分心。</div>`;
}

/* ============ nav ============ */
const T={home:['我的房產','2026 年 8 月 19 日'],houses:['我的房子',''],pl:['損益表',''],
  plh:['','2026 年 8 月'],add:['記一筆','三步完成'],new:['新增房子','四步完成'],ct:['建立合約','選日期、送出'],edit:['改房屋資料','點任一行就能改'],trade:['買賣紀錄','第二本帳：賣掉才結算'],acct:['收款帳戶','依戶頭對帳'],meter:['抄電表','只要打本期度數'],tenant:['房客看到的畫面','預覽']};
function setHdr(id){
  ttl.textContent = id==='plh'?(byId(plHid)?.name||'損益'):id==='edit'?(B[E.bi]?.name||'改資料'):id==='trade'?(B[TR.bi]?.name||'買賣'):T[id][0];
  sub.textContent = id==='houses'?(B.length?`${B.length} 個物件 · ${rooms()} 間房`:'尚未新增房子')
    : id==='home'?`2026 年 8 月 19 日${B.length?'　'+rooms()+' 間房':''}`
    : (id==='pl'||id==='plh')?PERIOD[period]:T[id][1];
}
function syncHdr(){ const c=document.querySelector('.screen.on'); if(c) setHdr(c.id.slice(2)); }
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('s-'+id).classList.add('on'); setHdr(id);
  back.style.display=['new','plh','ct','edit','trade','acct','meter','tenant'].includes(id)?'block':'none';
  const map={home:'home',houses:'houses',new:'houses',add:'add',pl:'pl',plh:'pl',ct:'houses',edit:'houses',trade:'pl',acct:'houses',meter:'houses',tenant:'houses'};
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===map[id]));
  document.querySelector('main').scrollTop=0;
}
function goBack(){ const c=document.querySelector('.screen.on').id.slice(2);
  show(c==='plh'?prev:c==='edit'?E.from:c==='trade'?TR.from:(['ct','new','acct','meter','tenant'].includes(c))?'houses':'home'); }
function tab(id){ if(id==='add'){resetA();renderAdd();} if(id==='new'){resetN();renderNew();} show(id); }
renderAll(); show('home');
</script>
