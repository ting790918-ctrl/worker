<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>系統櫃繪圖 試做版</title>
<style>
/* Layout: one-screen tool — top bar, drawing stage (paper) on the left, inspector on the right; inspector becomes a bottom sheet on narrow screens */
:root{
  --bg:#e9ece7; --panel:#f8f9f6; --raise:#ffffff; --ink:#1b2427; --muted:#5b686b; --line:#cfd5ce;
  --accent:#1c5b74; --accent-ink:#ffffff; --accent-soft:#d6e6ec; --red:#c8261c; --warn:#a4501a;
  --font:-apple-system,"PingFang TC","Heiti TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121719; --panel:#1a2124; --raise:#232c30; --ink:#e4eae8; --muted:#97a5a8; --line:#323e42;
  --accent:#7cbcd3; --accent-ink:#0d1a1f; --accent-soft:#1d3640; --red:#f06a5e; --warn:#e39a62; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121719; --panel:#1a2124; --raise:#232c30; --ink:#e4eae8; --muted:#97a5a8; --line:#323e42;
  --accent:#7cbcd3; --accent-ink:#0d1a1f; --accent-soft:#1d3640; --red:#f06a5e; --warn:#e39a62; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;background:var(--raise);border:1px solid var(--line);border-radius:9px;padding:0 12px;min-height:40px;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
button.danger{color:var(--red)}
button.armed{background:var(--red);color:#fff;border-color:var(--red)}
button:disabled{opacity:.4}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;width:100%;box-sizing:border-box}
input[type=number]{font-variant-numeric:tabular-nums;font-family:var(--mono)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
#app{height:100%;display:grid;grid-template-rows:auto 1fr}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.04em;margin-right:4px;white-space:nowrap}
.brand small{font-weight:500;color:var(--muted);margin-left:4px;letter-spacing:0}
.proj{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
#tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:120px;scrollbar-width:none}
#tabs button{white-space:nowrap;border-radius:20px;min-height:36px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:38px}
.seg button+button{border-left:1px solid var(--line)}
.spacer{flex:1}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:46px;z-index:30;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:6px;display:grid;gap:4px;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.menu button{text-align:left;border:0}
main{min-height:0}
#design{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:100%}
.stage{display:grid;grid-template-rows:auto 1fr;min-width:0;min-height:0}
.stagebar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px}
.hint{color:var(--muted);font-size:13px;flex:1;min-width:120px}
.wrap{overflow:auto;min-height:0;margin:0 16px 16px;border-radius:12px;background:#fdfdfb;border:1px solid var(--line);position:relative;-webkit-overflow-scrolling:touch}
#cv{display:block;touch-action:pan-x pan-y;user-select:none;-webkit-user-select:none}
#cv .hit{cursor:pointer}
#cv .drag{touch-action:none;cursor:ns-resize}
#cv .drag.v{cursor:ew-resize}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:#5b686b;text-align:center;padding:24px}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px 16px 40px;min-width:0}
aside h3{font-size:13px;color:var(--muted);font-weight:600;margin:18px 0 8px;letter-spacing:.06em}
aside h2{font-size:18px;margin:2px 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.num{display:inline-grid;place-items:center;min-width:26px;height:26px;border-radius:13px;background:var(--ink);color:var(--panel);font-size:13px;font-family:var(--mono);padding:0 6px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.crumbs button{min-height:34px;font-size:14px}
.f{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:8px;margin:6px 0}
.f>span{color:var(--muted);font-size:14px}
.f em{font-style:normal;color:var(--muted);font-size:13px}
.chk{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:38px}
.row{display:flex;gap:6px;flex-wrap:wrap}
.row>button{flex:1 1 auto}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper b{min-width:28px;text-align:center;font-family:var(--mono)}
.stepper button{width:40px;padding:0}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.warnbox{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px;margin:8px 0}
.size{font-family:var(--mono);font-variant-numeric:tabular-nums}
#sheet{display:grid;grid-template-rows:auto 1fr;height:100%}
.sheetbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px}
#sheetView{overflow:auto;padding:0 16px 24px;display:grid;gap:16px;align-content:start}
#sheetView svg{width:100%;height:auto;background:#fff;border-radius:6px;box-shadow:0 2px 14px rgba(0,0,0,.12);max-width:1400px}
.modal{position:fixed;inset:0;background:rgba(10,16,18,.45);z-index:50;display:grid;place-items:center;padding:16px}
.dialog{background:var(--panel);border-radius:16px;width:min(720px,100%);max-height:88vh;overflow:auto;padding:20px}
.dialog h2{margin:0 0 12px;font-size:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 16px}
.grid2 label{display:grid;gap:4px;font-size:13px;color:var(--muted);margin:4px 0}
.dialog .row{margin-top:14px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 18px;border-radius:22px;z-index:60;font-size:15px;max-width:90vw}
@media (max-width:900px){
  #design{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  aside{border-left:0;border-top:1px solid var(--line);max-height:44vh}
}
@media (max-width:600px){
  html,body{height:auto;overflow:auto}
  #app{height:auto}
  #design{display:block;height:auto}
  .wrap{height:56vh}
  aside{max-height:none}
}
@media (prefers-reduced-motion:no-preference){button{transition:background .12s,border-color .12s}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<div id="app">
  <header class="top">
    <div class="brand">系統櫃繪圖<small>試做版</small></div>
    <button id="projBtn" class="proj" title="案場資料"></button>
    <nav id="tabs" aria-label="櫃牆"></nav>
    <div class="seg" id="modeSeg"><button data-mode="design">設計</button><button data-mode="sheet">出圖</button></div>
    <button id="undoBtn" aria-label="復原">復原</button>
    <button id="redoBtn" aria-label="重做">重做</button>
    <button id="pdfBtn" class="primary">匯出 PDF</button>
    <div class="menuwrap"><button id="moreBtn" aria-label="更多">更多</button>
      <div class="menu" id="menu" hidden>
        <button data-menu="info">案場資料與圖框</button>

  <main id="design">
    <section class="stage">
      <div class="stagebar">
        <div class="seg" id="layerSeg"><button data-layer="struct">結構</button><button data-layer="door">門片</button></div>
        <span class="hint" id="hint"></span>
        <div class="seg"><button data-zoom="-1" aria-label="縮小">－</button><button data-zoom="0">適合</button><button data-zoom="1" aria-label="放大">＋</button></div>
      </div>
      <div class="wrap" id="wrap"><svg id="cv" xmlns="http://www.w3.org/2000/svg"></svg><div class="empty" id="emptyMsg" hidden>這面櫃牆還沒有櫃子。<br>在右側按「＋ 高櫃」或「＋ 上下櫃」開始。</div></div>
    </section>

    <div id="sheetView"></div>
  </main>
</div>

<div class="modal" id="infoModal" hidden>
  <form class="dialog" id="infoForm">
    <h2>案場資料與圖框</h2>
    <div class="grid2" id="infoFields"></div>
    <h3 style="font-size:13px;color:var(--muted);margin:16px 0 4px">預設規格</h3>
    <div class="grid2" id="setFields"></div>
    <div class="row"><button type="button" id="infoCancel">取消</button><button type="submit" class="primary">儲存</button></div>
  </form>
</div>
<div id="toast" hidden></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const R=n=>Math.round(n);
const f=n=>(Math.round(n*100)/100);
const pad2=n=>String(n).padStart(2,'0');

const BOX_TYPES=['高櫃','疊櫃','矮櫃','抽屜矮櫃','抽屜疊','滑門矮櫃','檯面櫃','吊櫃'];
const CONTENT={none:'空',drawer:'抽屜',rod:'掛衣桿',vrod:'直立式掛衣桿',open:'開放格'};
const DOORS={'':'無門',L:'左開',R:'右開',P:'對開',U:'上掀',D:'下翻'};
const DIVS={fixed:'固定層板',move:'活動層板',lamp:'坎燈層板'};
const INFO_FIELDS=[['name','案場名稱'],['company','設計公司（圖框左上）'],['client','客戶姓名'],['clientTel','客戶電話'],['designer','設計師'],['designerTel','設計師電話'],['factory','系統櫃工廠'],['factoryTel','工廠電話'],['orderDate','訂貨日期'],['deliverDate','交貨日期'],['address','交貨地址'],['shipping','貨運聯絡方式'],['cabColor','櫃體色號'],['doorColor','門片色號'],['doorHandle','門片把手'],['drawerHandle','抽屜把手'],['shelfMove','活動層板'],['shelfFixed','固定層板'],['lampShelf','坎燈層板'],['rod','吊衣桿'],['hardware','特殊五金']];

/* ---------- model ---------- */
function leaf(o={}){return Object.assign({id:uid(),size:null,split:null,kids:[],divs:[],content:'none',n:1,note:'',door:''},o)}
function cont(dir,kids,o={},divType='fixed'){const c=leaf(o);c.split=dir;c.kids=kids;c.divs=kids.slice(1).map(()=>divType);return c}
function eqShelves(n,o={},divType='move'){return cont('h',Array.from({length:n},()=>leaf()),o,divType)}
function mkBox(type,h,root,o={}){return Object.assign({id:uid(),kind:'box',type,h,d:380,door:true,noBottom:false,root:root||leaf()},o)}
function mkGap(h,o={}){return Object.assign({id:uid(),kind:'gap',h,back:true,top:false,d:400,note:''},o)}
function mkCol(w,items){return{id:uid(),w,items}}
function blankProject(){return{info:{name:'新案場'},settings:{t:18,doorT:20,kickStock:'2400*120*18'},walls:[{id:uid(),name:'櫃牆 1',place:'',kick:100,note:'',cols:[]}]}}
function sampleProject(){
  const lower=()=>{const r=cont('h',[cont('v',[leaf({content:'drawer'}),leaf({content:'drawer'})],{size:200}),cont('h',[leaf(),leaf()],{door:'P'},'move')]);return r};
  const c2=cont('h',[leaf({size:395}),leaf({content:'vrod'}),leaf({size:560,note:'無底板櫃'})],{door:'P'});c2.divs=['fixed','move'];
  return{
    info:{name:'板橋金世紀錄裝修案（範例）',cabColor:'HC-A3002AT索諾馬原橡',doorColor:'3/4/7/8號 HC-A3002AT索諾馬原橡',doorHandle:'其他門片/抽頭 HC-S6000BS白色'},
    settings:{t:18,doorT:20,kickStock:'2400*120*18'},
    walls:[{id:uid(),name:'客廳主牆',place:'左側落',kick:100,note:'',cols:[
      mkCol(800,[mkBox('高櫃',2410,eqShelves(9,{door:'P'}))]),
      mkCol(800,[mkBox('高櫃',2410,c2)]),
      mkCol(790,[mkBox('疊櫃',700,lower()),mkGap(900,{top:true}),mkBox('疊櫃',810,eqShelves(3,{door:'P'}))]),
      mkCol(790,[mkBox('疊櫃',700,lower()),mkGap(900,{top:true,note:'藏變壓器擋板'}),mkBox('疊櫃',810,eqShelves(3,{door:'P'}))]),
      mkCol(600,[mkBox('抽屜矮櫃',450,leaf({content:'drawer',n:2})),mkGap(1490),mkBox('吊櫃',470,cont('h',[leaf(),leaf()],{door:'P'}))]),
    ]}]
  };
}

/* ---------- state & persistence ---------- */
const KEY='cabinet-proto-v1';
let P=null;
try{const s=localStorage.getItem(KEY);if(s)P=JSON.parse(s)}catch(e){}
if(!P||!P.walls)P=sampleProject();
const ui={wall:0,mode:'design',layer:'struct',sel:null,zoom:1,eqN:3};
const undoS=[],redoS=[];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}
function commit(fn){undoS.push(JSON.stringify(P));if(undoS.length>100)undoS.shift();redoS.length=0;fn();persist();render()}
function undo(){if(!undoS.length)return;redoS.push(JSON.stringify(P));P=JSON.parse(undoS.pop());persist();render()}
function redo(){if(!redoS.length)return;undoS.push(JSON.stringify(P));P=JSON.parse(redoS.pop());persist();render()}
const T=()=>+P.settings.t||18;
const DT=()=>+P.settings.doorT||20;
const W=()=>P.walls[ui.wall];

/* ---------- geometry ---------- */
function kidSizes(node,len){
  const t=T(),n=node.kids.length;
  const fixed=node.kids.reduce((a,k)=>a+(k.size==null?0:+k.size),0);
  const autos=node.kids.filter(k=>k.size==null).length;
  const avail=len-(n-1)*t-fixed;
  if(!autos)return node.kids.map((k,i)=>i===n-1?+k.size+avail:+k.size);
  return node.kids.map(k=>k.size==null?avail/autos:+k.size);
}
function layoutWall(wall,start){
  const t=T();let x=0,num=start,H=0;const boxes=[],gaps=[],cols=[];
  wall.cols.forEach(col=>{
    let y=0;const its=[];
    col.items.forEach((it,i)=>{
      const r={x,y,w:+col.w,h:+it.h};
      if(it.kind==='box'){
        const kick=i===0?(+wall.kick||0):0;
        const bot=it.noBottom?0:t;
        its.push({it,col,r,kick,inner:{x:x+t,y:y+kick+bot,w:col.w-2*t,h:it.h-kick-bot-t}});
      }else its.push({it,col,r});
      y+=+it.h;
    });
    for(let k=its.length-1;k>=0;k--){const o=its[k];
      if(o.it.kind==='box'){o.num=num++;boxes.push(o)}
      else{if(o.it.back)o.numBack=num++;if(o.it.top)o.numTop=num++;gaps.push(o)}}
    H=Math.max(H,y);cols.push({col,x,h:y,its});x+=+col.w;
  });
  boxes.forEach(b=>b.walk=walkBox(b));
  return{wall,W:x,H,boxes,gaps,cols,start,end:num-1,next:num};
}
function layoutAll(){let n=1;return P.walls.map(w=>{const L=layoutWall(w,n);n=L.next;return L})}
function walkBox(b){const out={nodes:[],leaves:[],divs:[]};walk(b.it.root,b.inner,{t:'b',b:'b',l:'b',r:'b'},out,null,0,b,false);return out}
function walk(node,r,e,out,parent,idx,b,anc){
  const rec={node,r,e,parent,idx,b,anc,covered:anc||!!node.door};out.nodes.push(rec);
  if(!node.split||!node.kids.length){out.leaves.push(rec);return}
  const t=T(),n=node.kids.length,H=node.split==='h',sizes=kidSizes(node,H?r.h:r.w);
  let p=H?r.y+r.h:r.x;
  node.kids.forEach((k,i)=>{
    const s=sizes[i];let kr,ke;
    if(H){kr={x:r.x,y:p-s,w:r.w,h:s};ke={...e,t:i?'d':e.t,b:i<n-1?'d':e.b};p-=s}
    else{kr={x:p,y:r.y,w:s,h:r.h};ke={...e,l:i?'d':e.l,r:i<n-1?'d':e.r};p+=s}
    walk(k,kr,ke,out,node,i,b,rec.covered);
    if(i<n-1){const dr=H?{x:r.x,y:p-t,w:r.w,h:t}:{x:p,y:r.y,w:t,h:r.h};
      out.divs.push({node,i,r:dr,dir:node.split,type:node.divs[i]||'fixed',b,a:sizes[i],bb:sizes[i+1]});p+=H?-t:t}
  });
}
function cover(r,e,g=1.5){const t=T(),x=s=>s==='d'?t/2:t;
  const x0=r.x-x(e.l),x1=r.x+r.w+x(e.r),y0=r.y-x(e.b),y1=r.y+r.h+x(e.t);
  return{x:x0+g,y:y0+g,w:x1-x0-2*g,h:y1-y0-2*g}}
function findItem(id){for(const w of P.walls)for(const c of w.cols){const i=c.items.findIndex(it=>it.id===id);if(i>=0)return{wall:w,col:c,item:c.items[i],idx:i}}return null}
function findNode(n,id,parent=null,idx=0){if(n.id===id)return{node:n,parent,idx};for(let i=0;i<n.kids.length;i++){const r=findNode(n.kids[i],id,n,i);if(r)return r}return null}

/* ---------- drawing (shared by editor and sheet) ---------- */
function drawElev(L,M,o){
  const t=T(),ink=o.ink,red=o.red,sw=o.sw,fs=o.fs;
  const X=M.X,Y=M.Y,s=M.s;
  const rect=(r,a='')=>`<rect x="${f(X(r.x))}" y="${f(Y(r.y+r.h))}" width="${f(Math.max(0,r.w*s))}" height="${f(Math.max(0,r.h*s))}" ${a}/>`;
  const line=(x1,y1,x2,y2,a='')=>`<line x1="${f(X(x1))}" y1="${f(Y(y1))}" x2="${f(X(x2))}" y2="${f(Y(y2))}" ${a}/>`;
  const text=(x,y,str,sz,a='')=>`<text x="${f(X(x))}" y="${f(Y(y))}" font-size="${f(sz)}" text-anchor="middle" dominant-baseline="central" ${a}>${esc(str)}</text>`;
  const thin=`fill="none" stroke="${ink}" stroke-width="${f(sw*.7)}"`;
  let g='';
  const fitTxt=(r,str,sz)=>{const n=[...String(str)].length;return Math.min(sz,(r.w*s)/(n*1.05+.5),(r.h*s)*.7)};
  /* gaps */
  L.gaps.forEach(gp=>{const{it,r}=gp;
    if(o.ed)g+=rect(r,`fill="#eef1ec"`);
    if(o.layer==='struct'){
      if(it.back){g+=rect(r,thin);const lr={x:r.x,y:r.y+(it.top?t:0),w:r.w,h:r.h-(it.top?t:0)};g+=text(lr.x+lr.w/2,lr.y+lr.h/2,'背板',fitTxt(lr,'背板',fs),`fill="${ink}"`)}

        if(n.content==='vrod'){const cx=r.x+r.w/2,top=r.y+r.h-25,len=Math.min(r.h*.55,650);
          g+=line(cx,top,cx,top-len,`stroke="#1a8a9a" stroke-width="${f(sw*2)}"`)+line(cx-40,top-len,cx+40,top-len,`stroke="#1a8a9a" stroke-width="${f(sw*2)}"`);
          if(o.layer==='struct'&&!o.ed)g+=text(cx,top-len-90,'直立式掛衣桿',fitTxt({w:r.w,h:300},'直立式掛衣桿',fs*.85),`fill="${ink}"`)}
        if(n.note&&o.layer==='struct'&&!o.ed)g+=text(r.x+r.w/2,r.y+r.h/2,n.note,fitTxt(r,n.note,fs),`fill="${ink}"`);
        if(o.sheet&&o.layer==='struct'&&lv.parent){
          const H=lv.parent.split==='h',val=R(H?r.h:r.w);
          if(H&&r.h*s>4.5&&r.w*s>5)g+=`<text x="${f(X(r.x)+fs*.75)}" y="${f(Y(r.y+r.h/2))}" font-size="${f(fs*.8)}" text-anchor="middle" dominant-baseline="central" fill="${ink}" transform="rotate(-90 ${f(X(r.x)+fs*.75)} ${f(Y(r.y+r.h/2))})">${val}</text>`;
          if(!H&&r.w*s>6&&r.h*s>3)g+=`<text x="${f(X(r.x+r.w/2))}" y="${f(Y(r.y+r.h)+fs*.75)}" font-size="${f(fs*.8)}" text-anchor="middle" dominant-baseline="central" fill="${ink}">${val}</text>`;
        }
        if(o.ed&&o.layer==='struct'){
          const lab=[n.content!=='none'?CONTENT[n.content]+(n.content==='drawer'&&n.n>1?` ×${n.n}`:''):'',n.note].filter(Boolean).join('・');

          }

        if(r.w<=0||r.h<=0)g+=rect({x:r.x,y:r.y,w:Math.max(r.w,20),h:Math.max(r.h,20)},`fill="none" stroke="#c8261c" stroke-width="${f(sw*2)}"`);
      });
      g+='</g>';
    }
    if(o.layer==='door'){
      w.nodes.filter(x=>x.node.door).forEach(x=>{const c=cover(x.r,x.e);
        g+=rect(c,`fill="${o.ed?'rgba(255,255,255,.9)':'#fff'}" stroke="${ink}" stroke-width="${f(sw)}"`)+doorSym(c,x.node.door,M,red,sw)});
      w.leaves.forEach(lv=>{const n=lv.node;
        if(n.content==='drawer'&&!lv.anc){const c=cover(lv.r,lv.e),k=Math.max(1,+n.n||1),gp=3,fh=(c.h-(k-1)*gp)/k;
          for(let i=0;i<k;i++){const fr={x:c.x,y:c.y+i*(fh+gp),w:c.w,h:fh};
            g+=rect(fr,`fill="#fff" stroke="${ink}" stroke-width="${f(sw)}"`);
            g+=`<circle cx="${f(X(fr.x+fr.w/2))}" cy="${f(Y(fr.y+fr.h*.78))}" r="${f(o.mk*.75)}" fill="${ink}"/>`}}
        else if(!lv.covered&&n.content!=='drawer'){const lab=n.note||'開放格';g+=text(lv.r.x+lv.r.w/2,lv.r.y+lv.r.h/2,lab,fitTxt(lv.r,lab,fs),`fill="${ink}"`)}
      });
    }
    if(it.noBottom&&o.layer==='struct'&&!w.leaves.some(l=>l.node.note==='無底板櫃'))g+=text(b.inner.x+b.inner.w/2,b.inner.y+120,'無底板櫃',fitTxt({w:b.inner.w,h:200},'無底板櫃',fs),`fill="${ink}"`);
  });
  return g;
}
function doorSym(c,type,M,red,sw){
  const X0=M.X(c.x),X1=M.X(c.x+c.w),Yt=M.Y(c.y+c.h),Yb=M.Y(c.y),xm=(X0+X1)/2,ym=(Yt+Yb)/2;
  const pl=p=>`<polyline points="${p.map(f).join(' ')}" fill="none" stroke="${red}" stroke-width="${f(sw*1.1)}"/>`;
  if(type==='L')return pl([X1,Yt,X0,ym,X1,Yb]);
  if(type==='R')return pl([X0,Yt,X1,ym,X0,Yb]);
  if(type==='U')return pl([X0,Yb,xm,Yt,X1,Yb]);
  if(type==='D')return pl([X0,Yt,xm,Yb,X1,Yt]);
  if(type==='P')return pl([xm,Yt,X0,ym,xm,Yb])+pl([xm,Yt,X1,ym,xm,Yb])+`<line x1="${f(xm)}" y1="${f(Yt)}" x2="${f(xm)}" y2="${f(Yb)}" stroke="#000" stroke-width="${f(sw)}"/>`;
  return '';
}

/* ---------- editor ---------- */
let EM=null; // current editor mapping
function renderEditor(){
  const L=layoutAll()[ui.wall],wrap=$('#wrap'),svg=$('#cv');
  $('#emptyMsg').hidden=!!L.cols.length;
  if(!L.cols.length){svg.setAttribute('width',0);svg.setAttribute('height',0);svg.innerHTML='';EM=null;return}
  const cw=wrap.clientWidth,ch=wrap.clientHeight,padL=56,padR=40,padT=58,padB=36;
  const fit=Math.min((cw-padL-padR)/L.W,(ch-padT-padB)/L.H);
  const s=fit*ui.zoom,Wpx=Math.max(cw,L.W*s+padL+padR),Hpx=Math.max(ch,L.H*s+padT+padB);
  const ox=Math.max(padL,(Wpx-L.W*s)/2),oy=padT;
  const M={s,X:x=>ox+x*s,Y:y=>oy+(L.H-y)*s};EM={M,L};
  svg.setAttribute('width',Wpx);svg.setAttribute('height',Hpx);svg.setAttribute('viewBox',`0 0 ${Wpx} ${Hpx}`);
  let g=`<g font-family="-apple-system,'PingFang TC','Noto Sans TC',sans-serif">`;
  g+=`<line x1="${ox-30}" y1="${f(M.Y(0))}" x2="${f(M.X(L.W)+30)}" y2="${f(M.Y(0))}" stroke="#9aa49d" stroke-width="1.5"/>`;
  g+=drawElev(L,M,{layer:ui.layer,ed:true,ink:'#2a3337',red:'#d1291f',sw:1.2,fs:13,mk:4.5});
  /* height labels */
  g+=`<text x="${ox-14}" y="${f(M.Y(L.H/2))}" font-size="12" fill="#5b686b" text-anchor="middle" transform="rotate(-90 ${ox-14} ${f(M.Y(L.H/2))})" font-family="ui-monospace,Menlo,monospace">總高 ${R(L.H)}</text>`;
  /* hit layer */
  let h='';
  const hr=(r,sel,cls='hit',ex=0)=>`<rect class="${cls}" data-sel="${sel}" x="${f(M.X(r.x)-ex)}" y="${f(M.Y(r.y+r.h)-ex)}" width="${f(Math.max(1,r.w*s+2*ex))}" height="${f(Math.max(1,r.h*s+2*ex))}" fill="transparent"/>`;
  L.gaps.forEach(gp=>h+=hr(gp.r,`gap:${gp.it.id}`));
  L.boxes.forEach(b=>{
    if(ui.layer==='struct'){
      b.walk.leaves.forEach(lv=>h+=hr(lv.r,`node:${b.it.id}:${lv.node.id}`));
      b.walk.divs.forEach(d=>{const ex=Math.max(0,(22-T()*s)/2);
        const r=d.dir==='h'?{x:d.r.x,y:d.r.y-ex/s,w:d.r.w,h:d.r.h+2*ex/s}:{x:d.r.x-ex/s,y:d.r.y,w:d.r.w+2*ex/s,h:d.r.h};
        h+=hr(r,`div:${b.it.id}:${d.node.id}:${d.i}`,'hit drag'+(d.dir==='v'?' v':''))});
    }else{
      b.walk.leaves.forEach(lv=>h+=hr(lv.r,`node:${b.it.id}:${(nearestDoor(lv)||lv).node.id}`));
      b.walk.nodes.filter(x=>x.node.door).forEach(x=>h+=hr(cover(x.r,x.e),`node:${b.it.id}:${x.node.id}`));
    }
  });
  /* selection highlight */
  const sr=selRect(L);
  if(sr)g+=`<rect x="${f(M.X(sr.x)-2)}" y="${f(M.Y(sr.y+sr.h)-2)}" width="${f(sr.w*s+4)}" height="${f(sr.h*s+4)}" fill="#1d7fa3" fill-opacity=".13" stroke="#1d7fa3" stroke-width="2.5" pointer-events="none"/>`;
  /* column chips & box badges */
  L.cols.forEach(c=>{const x0=M.X(c.x)+2,wd=c.col.w*s-4,on=ui.sel&&ui.sel.k==='col'&&ui.sel.id===c.col.id;
    h+=`<g class="hit" data-sel="col:${c.col.id}"><rect x="${f(x0)}" y="${f(M.Y(L.H)-44)}" width="${f(wd)}" height="30" rx="8" fill="${on?'#1d7fa3':'#e3e8e3'}"/><text x="${f(x0+wd/2)}" y="${f(M.Y(L.H)-29)}" font-size="13" text-anchor="middle" dominant-baseline="central" fill="${on?'#fff':'#2a3337'}" font-family="ui-monospace,Menlo,monospace" pointer-events="none">${R(c.col.w)}</text></g>`});
  L.boxes.forEach(b=>{const on=ui.sel&&ui.sel.k==='box'&&ui.sel.id===b.it.id,cx=M.X(b.r.x)+14,cy=M.Y(b.r.y+b.r.h)+14;
    h+=`<g class="hit" data-sel="box:${b.it.id}"><circle cx="${f(cx)}" cy="${f(cy)}" r="11" fill="${on?'#1d7fa3':'#2a3337'}"/><text x="${f(cx)}" y="${f(cy)}" font-size="11" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#fff" pointer-events="none">${b.num}</text></g>`});
  svg.innerHTML=g+'</g>'+`<g font-family="-apple-system,'PingFang TC',sans-serif">${h}</g>`;
}
function nearestDoor(lv){let rec=null;const all=lv.b.walk.nodes;let cur=lv;
  while(cur){if(cur.node.door)return cur;const p=cur.parent;cur=p?all.find(x=>x.node===p):null}return rec}
function selRect(L){const s=ui.sel;if(!s)return null;
  if(s.k==='col'){const c=L.cols.find(c=>c.col.id===s.id);return c?{x:c.x,y:0,w:c.col.w,h:c.h}:null}
  if(s.k==='box'||s.k==='gap'){const o=[...L.boxes,...L.gaps].find(o=>o.it.id===s.id);return o?o.r:null}
  const b=L.boxes.find(b=>b.it.id===s.id);if(!b)return null;
  if(s.k==='node'){const r=b.walk.nodes.find(x=>x.node.id===s.node);if(!r)return null;return ui.layer==='door'&&r.node.door?cover(r.r,r.e):r.r}
  if(s.k==='div'){const d=b.walk.divs.find(d=>d.node.id===s.node&&d.i===s.i);return d?d.r:null}
  return null}

/* pointer handling: tap selects, drag on a shelf moves it */
let drag=null;
$('#cv').addEventListener('pointerdown',e=>{
  const el=e.target.closest('[data-sel]');if(!el)return;
  const sel=el.dataset.sel;drag={sel,x:e.clientX,y:e.clientY,moved:false,id:e.pointerId};
  if(sel.startsWith('div:')&&ui.layer==='struct'){
    const[,boxId,nodeId,i]=sel.split(':');const fi=findItem(boxId),fn=findNode(fi.item.root,nodeId);
    const L=EM.L,b=L.boxes.find(b=>b.it.id===boxId),d=b.walk.divs.find(d=>d.node.id===nodeId&&d.i===+i);
    Object.assign(drag,{div:true,boxId,nodeId,i:+i,a:d.a,b:d.bb,dir:d.dir,snap:JSON.stringify(P)});
    el.setPointerCapture&&el.setPointerCapture(e.pointerId);e.preventDefault();
  }
});
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.hypot(dx,dy)<6)return;
  drag.moved=true;
  if(!drag.div)return;
  let d=(drag.dir==='h'?dy:dx)/EM.M.s;d=Math.round(d/5)*5;
  const a=Math.max(20,drag.a+d),bb=drag.a+drag.b-a;if(bb<20)return;
  const fi=findItem(drag.boxId),fn=findNode(fi.item.root,drag.nodeId);
  fn.node.kids[drag.i].size=R(a);fn.node.kids[drag.i+1].size=R(bb);
  ui.sel={k:'div',id:drag.boxId,node:drag.nodeId,i:drag.i};
  $('#hint').textContent=drag.dir==='h'?`上格 ${R(a)}　下格 ${R(bb)}`:`左格 ${R(a)}　右格 ${R(bb)}`;
  if(!drag.raf)drag.raf=requestAnimationFrame(()=>{drag&&(drag.raf=0);renderEditor();renderInsp()});
});
window.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.id)return;const dg=drag;drag=null;
  if(dg.div&&dg.moved){undoS.push(dg.snap);redoS.length=0;persist();render();return}
  if(!dg.moved)select(dg.sel);
});
window.addEventListener('pointercancel',()=>{if(drag&&drag.div&&drag.moved){undoS.push(drag.snap);persist()}drag=null;render()});
function select(sel){const p=sel.split(':');
  if(p[0]==='col')ui.sel={k:'col',id:p[1]};
  else if(p[0]==='box')ui.sel={k:'box',id:p[1]};
  else if(p[0]==='gap')ui.sel={k:'gap',id:p[1]};
  else if(p[0]==='node')ui.sel={k:'node',id:p[1],node:p[2]};
  else if(p[0]==='div')ui.sel={k:'div',id:p[1],node:p[2],i:+p[3]};

}

function act(a,v,el){

  case 'item-above':commit(()=>{const fi=findItem(s.id);const it=newBoxFor(v,fi.col.w);fi.col.items.splice(fi.idx+1,0,it);ui.sel={k:it.kind==='box'?'box':'gap',id:it.id}});break;

  const d0=(()=>{const c=L.cols[0];const bx=c.its.filter(o=>o.it.kind==='box');return Math.max(...bx.map(o=>+o.it.d),0)||380})();
  L.cols.forEach(c=>g+=dimH(ox+c.x*sx,ox+(c.x+c.col.w)*sx,py-2.5,R(c.col.w),fsD,sw*.8));
  g+=dimV(ox-3,py,py+d0*sx,R(d0),fsD,sw*.8)+dimV(ox-3,py+d0*sx,py+(d0+DT())*sx,DT(),fsD*.8,sw*.8);
  g+=dimV(ox+L.W*sx+4,py,py+(d0+DT())*sx,R(d0+DT()),fsD,sw*.8);
  /* structure elevation */
  const sy=py+Dmax*sx+18;
  const MS={s:sx,X:x=>ox+x*sx,Y:y=>sy+(L.H-y)*sx};
  g+=`<g stroke-linejoin="round">${drawElev(L,MS,{layer:'struct',sheet:true,ink:'#000',red:'#e00000',sw,fs:2.1,mk:.75})}</g>`;
  L.cols.forEach(c=>g+=dimH(MS.X(c.x),MS.X(c.x+c.col.w),MS.Y(L.H)-3,R(c.col.w),fsD,sw*.8));
  if(L.cols.length>1)g+=dimH(MS.X(0),MS.X(L.W),MS.Y(L.H)-7,R(L.W),fsD,sw*.8);
  const kick=+L.wall.kick||0;
  if(kick)g+=dimV(MS.X(0)-4,MS.Y(0),MS.Y(kick),kick,fsD*.85,sw*.8);
  g+=dimV(MS.X(0)-4,MS.Y(kick),MS.Y(L.H),R(L.H-kick),fsD,sw*.8);
  const lc=L.cols[L.cols.length-1];let yy=0;
  lc.its.forEach(o=>{g+=dimV(MS.X(L.W)+4,MS.Y(yy),MS.Y(yy+o.it.h),R(o.it.h),fsD,sw*.8);yy+=+o.it.h});
  g+=dimV(MS.X(L.W)+8.5,MS.Y(0),MS.Y(L.H),R(L.H),fsD,sw*.8);
  if(L.wall.place)g+=tx(MS.X(0)+L.cols[0].col.w*sx/2,MS.Y(0)+4.5,L.wall.place,3,'text-anchor="middle" fill="#e00000"');
  /* cabinet list */
  const ent=listEntries(L),ly0=MS.Y(0)+9,lh=241-ly0,perCol=Math.max(1,Math.ceil(ent.length/2)),lineH=Math.min(6.2,lh/perCol),lfs=Math.min(4,lineH*.66);
  ent.forEach((e,i)=>{const col=i<perCol?0:1;g+=tx(10+col*78,ly0+lineH*(i%perCol)+lineH*.6,e,fitFs(e,76,lfs),'fill="#e00000"')});
  /* door elevation */
  const dx0=172,dy0=124,dw=120,dh=114,sd=Math.min(dw/L.W,(dh-8)/L.H);
  const MD={s:sd,X:x=>dx0+(dw-L.W*sd)/2+x*sd,Y:y=>dy0+6+(L.H-y)*sd};
  g+=drawElev(L,MD,{layer:'door',sheet:true,ink:'#000',red:'#e00000',sw,fs:1.9,mk:.7});
  L.cols.forEach(c=>g+=dimH(MD.X(c.x),MD.X(c.x+c.col.w),MD.Y(L.H)-2.5,R(c.col.w),fsD*.85,sw*.8));
  g+=dimV(MD.X(0)-3,MD.Y(0),MD.Y(L.H),R(L.H),fsD*.85,sw*.8);
  /* axonometric */
  g+=axon(L,{x:174,y:10,w:118,h:106},sw);
  return wrapSheet(g,px);
}
function wrapSheet(g,px){const wh=px?`width="${px*420}" height="${px*297}"`:'';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 297" ${wh} ${SF}><rect width="420" height="297" fill="#fff"/>${g}</svg>`}
function axon(L,box,sw){
  const cx=.42,cy=.24;const Dm=Math.max(...L.boxes.map(b=>+b.it.d),...L.gaps.map(x=>+x.it.d),300);
  const tw_=L.W+Dm*cx,th=L.H+Dm*cy,sa=Math.min(box.w/tw_,box.h/th);
  const ox=box.x+(box.w-tw_*sa)/2,oy=box.y+(box.h-th*sa)/2;
  const P2=(x,y,z)=>[ox+(x+z*cx)*sa,oy+(th-(y+z*cy))*sa];
  const poly=(pts,fill='#fff')=>`<polygon points="${pts.map(p=>p.map(f).join(',')).join(' ')}" fill="${fill}" stroke="#000" stroke-width="${f(sw)}" stroke-linejoin="round"/>`;
  let g='',labels='';const nfs=Math.min(5,Math.max(2.6,sa*170));
  L.cols.forEach(c=>c.its.forEach(o=>{const r=o.r;
    if(o.it.kind==='gap'){const d=+o.it.d;
      if(o.it.back){g+=poly([P2(r.x,r.y,d),P2(r.x+r.w,r.y,d),P2(r.x+r.w,r.y+r.h,d),P2(r.x,r.y+r.h,d)]);const p=P2(r.x+r.w*.55,r.y+r.h*.55,d);labels+=num2(p,o.numBack+(r.w>500?'背板':''),nfs*.85)}
      if(o.it.top){const T_=T();g+=poly([P2(r.x,r.y+T_,0),P2(r.x+r.w,r.y+T_,0),P2(r.x+r.w,r.y+T_,d),P2(r.x,r.y+T_,d)])+poly([P2(r.x,r.y,0),P2(r.x+r.w,r.y,0),P2(r.x+r.w,r.y+T_,0),P2(r.x,r.y+T_,0)]);const p=P2(r.x+r.w*.35,r.y+T_,d*.5);labels+=num2(p,o.numTop+(r.w>500?'台面板':''),nfs*.85)}
      return}
    const d=+o.it.d+(o.it.door?DT():0),x0=r.x,x1=r.x+r.w,y0=r.y,y1=r.y+r.h;
    g+=poly([P2(x0,y1,0),P2(x1,y1,0),P2(x1,y1,d),P2(x0,y1,d)]);
    g+=poly([P2(x1,y0,0),P2(x1,y1,0),P2(x1,y1,d),P2(x1,y0,d)]);
    g+=poly([P2(x0,y0,0),P2(x1,y0,0),P2(x1,y1,0),P2(x0,y1,0)]);
    if(o.kick){const a=P2(x0,y0+o.kick,0),b=P2(x1,y0+o.kick,0);g+=`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="#000" stroke-width="${f(sw*.7)}"/>`}
    o.walk.nodes.filter(x=>x.node.door).forEach(x=>{const cv=cover(x.r,x.e);
      if(x.node.door==='P'){const m=cv.x+cv.w/2,a=P2(m,cv.y,0),b=P2(m,cv.y+cv.h,0);g+=`<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="#000" stroke-width="${f(sw*.7)}"/>`}
      g+=`<polygon points="${[P2(cv.x,cv.y,0),P2(cv.x+cv.w,cv.y,0),P2(cv.x+cv.w,cv.y+cv.h,0),P2(cv.x,cv.y+cv.h,0)].map(p=>p.map(f).join(',')).join(' ')}" fill="none" stroke="#000" stroke-width="${f(sw*.6)}"/>`});
    const p=P2(x0+Math.min(r.w*.28,180),y1-Math.min(r.h*.18,260),0);labels+=num2(p,o.num,nfs);
  }));
  return g+labels}
function num2(p,s,fs){return `<text x="${f(p[0])}" y="${f(p[1])}" font-size="${f(fs)}" fill="#e00000" text-anchor="middle" dominant-baseline="central">${esc(s)}</text>`}

/* ---------- PDF ---------- */
const dlP=(window.claude&&window.claude.use)?window.claude.use('downloads'):Promise.resolve(null);
function svgToCanvas(svg,px){return new Promise((res,rej)=>{const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=420*px;c.height=297*px;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);res(c)};
  img.onerror=()=>rej(new Error('圖面轉換失敗'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)})}
let busy=false;
async function exportPDF(){
  if(busy)return;
  if(!window.jspdf){toast('PDF 元件沒有載入，請確認網路後重新開啟頁面');return}
  busy=true;toast('正在產生 PDF…',0);
  try{
    const all=layoutAll(),px=8,doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a3',compress:true});
    for(let i=0;i<all.length;i++){if(i)doc.addPage('a3','landscape');const c=await svgToCanvas(sheetSVG(all,i,px),px);doc.addImage(c,'PNG',0,0,420,297,undefined,'FAST')}
    const blob=doc.output('blob'),dl=await dlP;
    if(!dl){toast('這個畫面不能存檔，請在 Claude 裡開啟這個頁面');return}
    await dl.save({filename:`${(P.info.name||'施工圖').replace(/[\\/:*?"<>|]/g,'')}_施工圖.pdf`,data:blob});
    toast('PDF 已存檔');
  }catch(e){toast(e&&e.code==='declined'?'已取消存檔':'無法存檔：'+(e&&(e.message||e.code)||'未知原因'))}
  finally{busy=false}
}
async function backup(){const dl=await dlP;if(!dl){toast('這個畫面不能存檔');return}
  try{await dl.save({filename:`${(P.info.name||'案場').replace(/[\\/:*?"<>|]/g,'')}.json`,data:JSON.stringify(P,null,1)});toast('案場檔已存檔')}
  catch(e){toast(e&&e.code==='declined'?'已取消存檔':'無法存檔')}}

/* ---------- top level render ---------- */
function validSel(){const s=ui.sel;if(!s)return;
  if(s.k==='col'){if(!W().cols.some(c=>c.id===s.id))ui.sel=null;return}
  const fi=findItem(s.id);if(!fi||fi.wall!==W()){ui.sel=null;return}
  if((s.k==='node'||s.k==='div')&&!findNode(fi.item.root,s.node))ui.sel={k:'box',id:s.id};
  if(s.k==='div'){const fn=findNode(fi.item.root,s.node);if(!fn||!fn.node.split||s.i>=fn.node.kids.length-1)ui.sel={k:'box',id:s.id}}}
function render(){
  if(ui.wall>=P.walls.length)ui.wall=P.walls.length-1;
  validSel();
  $('#projBtn').textContent=P.info.name||'未命名案場';
  $('#tabs').innerHTML=P.walls.map((w,i)=>`<button data-wall="${i}" class="${i===ui.wall?'on':''}">${esc(w.name)}</button>`).join('')+`<button data-wall="new" aria-label="新增櫃牆">＋</button>`;
  document.querySelectorAll('#modeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.mode===ui.mode));
  document.querySelectorAll('#layerSeg button').forEach(b=>b.classList.toggle('on',b.dataset.layer===ui.layer));
  $('#undoBtn').disabled=!undoS.length;$('#redoBtn').disabled=!redoS.length;
  $('#design').hidden=ui.mode!=='design';$('#sheet').hidden=ui.mode!=='sheet';
  if(ui.mode==='design'){renderEditor();renderInsp();
    if(!drag)$('#hint').textContent=ui.layer==='struct'?'點格子選取，拖動層板調整位置':'點門片或格子設定開門方式'}
  else{const all=layoutAll();$('#sheetView').innerHTML=all.map((_,i)=>sheetSVG(all,i)).join('')}
}

/* ---------- top bar events ---------- */
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-wall]');if(!b)return;
  if(b.dataset.wall==='new'){act('wall-add');return}ui.wall=+b.dataset.wall;ui.sel=null;render()});
$('#modeSeg').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b){ui.mode=b.dataset.mode;render()}});
$('#layerSeg').addEventListener('click',e=>{const b=e.target.closest('[data-layer]');if(b){ui.layer=b.dataset.layer;render()}});
document.querySelector('.stagebar').addEventListener('click',e=>{const b=e.target.closest('[data-zoom]');if(!b)return;const z=+b.dataset.zoom;ui.zoom=z===0?1:Math.min(4,Math.max(.5,ui.zoom*(z>0?1.4:1/1.4)));renderEditor()});
$('#undoBtn').onclick=undo;$('#redoBtn').onclick=redo;
$('#pdfBtn').onclick=exportPDF;$('#pdfBtn2').onclick=exportPDF;
$('#projBtn').onclick=openInfo;
$('#moreBtn').onclick=e=>{e.stopPropagation();$('#menu').hidden=!$('#menu').hidden};
document.addEventListener('click',e=>{if(!e.target.closest('.menuwrap'))$('#menu').hidden=true});
$('#menu').addEventListener('click',e=>{const b=e.target.closest('[data-menu]');if(!b)return;$('#menu').hidden=true;const m=b.dataset.menu;
  if(m==='info')openInfo();
  if(m==='backup')backup();
  if(m==='import')$('#fileIn').click();
  if(m==='sample')commit(()=>{P=sampleProject();ui.wall=0;ui.sel=null});
  if(m==='blank')commit(()=>{P=blankProject();ui.wall=0;ui.sel=null});
});
$('#fileIn').onchange=e=>{const file=e.target.files[0];if(!file)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.walls)throw 0;commit(()=>{P=d;P.settings=P.settings||{t:18,doorT:20,kickStock:'2400*120*18'};P.info=P.info||{};ui.wall=0;ui.sel=null});toast('已匯入案場')}catch(err){toast('這個檔案不是案場檔')}};
  r.readAsText(file);e.target.value=''};
function openInfo(){const i=P.info||{},s=P.settings;
  $('#infoFields').innerHTML=INFO_FIELDS.map(([k,l])=>`<label>${l}<input type="text" id="i-${k}" name="${k}" value="${esc(i[k]||'')}"></label>`).join('');
  $('#setFields').innerHTML=`<label>板厚（mm）<input type="number" inputmode="decimal" id="s-t" name="s_t" value="${s.t}"></label><label>門片厚（mm，櫃深 +）<input type="number" inputmode="decimal" id="s-doorT" name="s_doorT" value="${s.doorT}"></label><label>踢腳料規格<input type="text" id="s-kick" name="s_kick" value="${esc(s.kickStock)}"></label>`;
  $('#infoModal').hidden=false}
$('#infoCancel').onclick=()=>$('#infoModal').hidden=true;
$('#infoForm').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target);
  commit(()=>{INFO_FIELDS.forEach(([k])=>P.info[k]=fd.get(k)||'');P.settings.t=+fd.get('s_t')||18;P.settings.doorT=+fd.get('s_doorT')||0;P.settings.kickStock=fd.get('s_kick')||'2400*120*18'});
  $('#infoModal').hidden=true});
let toastT=0;function toast(m,ms=2600){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toastT);if(ms)toastT=setTimeout(()=>el.hidden=true,ms)}
window.addEventListener('resize',()=>{if(ui.mode==='design')renderEditor()});
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();e.shiftKey?redo():undo()}});
render();
</script>
